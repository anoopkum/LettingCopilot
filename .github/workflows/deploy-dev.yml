name: CI/CD — Test, Build, Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0300667287
  REGION: us-central1
  REPO: letting-copilot
  SERVICE: letting-copilot

jobs:
  # ── Job 1: Unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Run tool tests
        run: pytest tests/test_tools.py -v --tb=short
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "false"
          AVA_MODEL: gemini-flash-latest

  # ── Job 2: Build & push Docker image ─────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
          docker build -t "${IMAGE}:${{ steps.tag.outputs.tag }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ steps.tag.outputs.tag }}"
          docker push "${IMAGE}:latest"

  # ── Job 3: Terraform — Cloud Run deploy (remote GCS state) ───────────────────
  deploy:
    name: Terraform Deploy (dev)
    runs-on: ubuntu-latest
    needs: build-push
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init (remote GCS backend)
        working-directory: terraform/dev
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/dev
        run: |
          terraform apply -auto-approve -input=false \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="image_tag=${{ needs.build-push.outputs.image_tag }}" \
            -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}"

      - name: Smoke test & output URL
        working-directory: terraform/dev
        run: |
          URL=$(terraform output -raw service_url)
          sleep 5
          curl -sf "${URL}/health" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          echo "### ✅ Deployed: ${URL}" >> $GITHUB_STEP_SUMMARY
          echo "Live URL: ${URL}"
