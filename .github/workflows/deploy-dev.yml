name: CI/CD — Test, Build, Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0300667287
  REGION: us-central1
  REPO: letting-copilot
  SERVICE: letting-copilot

jobs:
  # ── Job 1: Unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Run tool + guardrail tests
        run: pytest tests/test_tools.py tests/test_guardrails.py -v --tb=short
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "false"
          AVA_MODEL: gemini-flash-latest

  # ── Job 2: Build & push — semver + sha image tags ────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      semver: ${{ steps.tag.outputs.semver }}
      sha_short: ${{ steps.tag.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: tag
        name: Compute image tags
        run: |
          SEMVER=$(cat VERSION | tr -d '[:space:]')
          SHA_SHORT=${GITHUB_SHA::8}
          # Production tag pattern: v<semver>-<sha>  e.g. v0.1.0-a1b2c3d4
          IMAGE_TAG="v${SEMVER}-${SHA_SHORT}"
          echo "semver=${SEMVER}"       >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push with all tags
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
          SEMVER=${{ steps.tag.outputs.semver }}
          SHA=${{ steps.tag.outputs.sha_short }}
          TAG=${{ steps.tag.outputs.image_tag }}

          docker build \
            --label "org.opencontainers.image.version=${SEMVER}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=https://github.com/anoopkum/LettingCopilot" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:v${SEMVER}" \
            -t "${IMAGE}:sha-${SHA}" \
            -t "${IMAGE}:latest" \
            .

          # Push all tags
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:v${SEMVER}"
          docker push "${IMAGE}:sha-${SHA}"
          docker push "${IMAGE}:latest"

          echo "### Image tags pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${TAG}\` (production pin)" >> $GITHUB_STEP_SUMMARY
          echo "- \`v${SEMVER}\` (semver)" >> $GITHUB_STEP_SUMMARY
          echo "- \`sha-${SHA}\` (git sha)" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\` (floating)" >> $GITHUB_STEP_SUMMARY

  # ── Job 3: Terraform — Cloud Run deploy ──────────────────────────────────────
  deploy:
    name: Terraform Deploy (dev)
    runs-on: ubuntu-latest
    needs: build-push
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init (remote GCS backend)
        working-directory: terraform/dev
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform/dev
        # JSON secrets (SA key) must go via TF_VAR_* env vars — -var= breaks on special chars
        env:
          TF_VAR_gemini_api_key:           ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_jwt_secret:               ${{ secrets.JWT_SECRET }}
          TF_VAR_google_calendar_sa_json:  ${{ secrets.GOOGLE_CALENDAR_SA_JSON }}
          TF_VAR_google_calendar_id:       ${{ secrets.GOOGLE_CALENDAR_ID }}
          TF_VAR_google_oauth_client_id:   ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_sendgrid_api_key:         ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_sendgrid_from_email:      ${{ secrets.SENDGRID_FROM_EMAIL }}
        run: |
          # Deploy the pinned semver+sha tag — never deploy :latest to Cloud Run
          terraform apply -auto-approve -input=false \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="image_tag=${{ needs.build-push.outputs.image_tag }}"

      - name: Smoke test & output URL
        working-directory: terraform/dev
        run: |
          URL=$(terraform output -raw service_url)
          sleep 5
          curl -sf "${URL}/health" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          echo "### ✅ Deployed ${{ needs.build-push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "### Live: ${URL}" >> $GITHUB_STEP_SUMMARY
          echo "Live URL: ${URL}"
