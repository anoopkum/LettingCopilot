<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LettingCopilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a3c5e; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span.badge { background: #2ecc71; color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; }
    #auth-status { font-size: 0.75rem; margin-left: auto; opacity: 0.7; }
    #auth-status.ok { color: #2ecc71; opacity: 1; }
    #user-chip { display: none; align-items: center; gap: 8px; margin-left: auto; }
    #user-chip img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #2ecc71; }
    #user-chip span { font-size: 0.8rem; }
    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 72%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.93rem; }
    .msg.user { background: #1a3c5e; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ava { background: white; color: #222; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .msg.ava .name { font-size: 0.75rem; font-weight: 600; color: #1a3c5e; margin-bottom: 4px; }
    .msg.ava .agent-tag { font-size: 0.68rem; color: #888; margin-top: 6px; }
    .msg.typing span { display: inline-block; width: 6px; height: 6px; background: #aaa; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
    .msg.typing span:nth-child(2) { animation-delay: .2s; }
    .msg.typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
    #input-area { background: white; border-top: 1px solid #e0e6ed; padding: 16px 20px; display: flex; gap: 10px; }
    #msg-input { flex: 1; border: 1px solid #d0d8e4; border-radius: 24px; padding: 10px 18px; font-size: 0.93rem; outline: none; }
    #msg-input:focus { border-color: #1a3c5e; }
    #send-btn { background: #1a3c5e; color: white; border: none; border-radius: 24px; padding: 10px 22px; cursor: pointer; font-size: 0.93rem; font-weight: 600; transition: background .2s; }
    #send-btn:hover { background: #14304d; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* Google Sign-In overlay */
    #signin-overlay { position: fixed; inset: 0; background: rgba(15,30,50,.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
    #signin-box { background: white; border-radius: 16px; padding: 40px 32px; text-align: center; max-width: 360px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    #signin-box .logo { font-size: 2.5rem; margin-bottom: 12px; }
    #signin-box h2 { color: #1a3c5e; margin-bottom: 8px; }
    #signin-box p { color: #666; font-size: 0.9rem; margin-bottom: 28px; }
    #g-signin-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 0.95rem; font-weight: 500; transition: background .15s; }
    #g-signin-btn:hover { background: #f8f8f8; }
    #g-signin-btn svg { flex-shrink: 0; }
    #signin-error { color: #e74c3c; font-size: 0.85rem; margin-top: 12px; display: none; }
  </style>
</head>
<body>

<!-- Google Sign-In overlay (shown if OAuth is enabled and user not signed in) -->
<div id="signin-overlay" style="display:none">
  <div id="signin-box">
    <div class="logo">🏠</div>
    <h2>LettingCopilot</h2>
    <p>Sign in with your Google account to start your property search.</p>
    <div id="g-signin-btn-wrapper"></div>
    <div id="signin-error"></div>
  </div>
</div>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="#2ecc71"/><text x="14" y="19" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif" font-weight="bold">L</text></svg>
  <h1>LettingCopilot <span style="font-weight:300;opacity:.7">— AI Lettings Agent</span></h1>
  <span class="badge">Dev</span>
  <!-- shown in dev/JWT mode -->
  <span class="auth-status" id="auth-status">authenticating…</span>
  <!-- shown in Google OAuth mode -->
  <div id="user-chip">
    <img id="user-avatar" src="" alt="avatar">
    <span id="user-name"></span>
  </div>
</header>

<div id="chat-container">
  <div class="msg ava">
    <div class="name">LettingCopilot</div>
    Hi! I'm your AI lettings agent. Which property are you enquiring about, or how can I help you today?
  </div>
</div>

<div id="input-area">
  <input id="msg-input" type="text" placeholder="Type your message…" autocomplete="off" />
  <button id="send-btn" disabled>Send</button>
</div>

<!-- Google Identity Services (loaded only when needed) -->
<script>
  const chatEl  = document.getElementById('chat-container');
  const input   = document.getElementById('msg-input');
  const btn     = document.getElementById('send-btn');
  const authEl  = document.getElementById('auth-status');
  const overlay = document.getElementById('signin-overlay');

  let sessionId = null;
  let _token    = null;
  let _oauthEnabled = false;
  let _googleClientId = '';

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function addMsg(text, role, agentName) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    if (role === 'ava') {
      const label = agentName && agentName !== 'ava_orchestrator' ? agentName : 'LettingCopilot';
      div.innerHTML = `<div class="name">${escHtml(label)}</div>${escHtml(text)}`;
      if (agentName && !['ava_orchestrator','guardrail'].includes(agentName)) {
        div.innerHTML += `<div class="agent-tag">via ${escHtml(agentName)}</div>`;
      }
    } else {
      div.textContent = text;
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg ava typing';
    div.innerHTML = '<div class="name">LettingCopilot</div><span></span><span></span><span></span>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function setReady(user) {
    btn.disabled = false;
    input.focus();
    if (user) {
      // OAuth mode — show user chip
      authEl.style.display = 'none';
      const chip = document.getElementById('user-chip');
      chip.style.display = 'flex';
      document.getElementById('user-avatar').src = user.picture || '';
      document.getElementById('user-avatar').style.display = user.picture ? '' : 'none';
      document.getElementById('user-name').textContent = user.name || user.email || '';
    } else {
      authEl.textContent = '● authenticated';
      authEl.classList.add('ok');
    }
  }

  // ── Step 1: Load auth config from server ─────────────────────────────────────
  async function init() {
    try {
      const r = await fetch('/auth/config');
      const cfg = await r.json();
      _oauthEnabled   = cfg.oauth_enabled;
      _googleClientId = cfg.google_client_id;
    } catch(e) {
      _oauthEnabled = false;
    }

    if (_oauthEnabled && _googleClientId) {
      loadGoogleSignIn();
    } else {
      await obtainDevToken();
    }
  }

  // ── Dev mode: POST /auth/token ────────────────────────────────────────────────
  async function obtainDevToken() {
    authEl.style.display = '';
    try {
      const res = await fetch('/auth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: 'ui-guest', client_secret: 'ui-guest-secret' }),
      });
      if (!res.ok) throw new Error('auth failed');
      const data = await res.json();
      _token = data.access_token;
      setReady(null);
    } catch(e) {
      authEl.textContent = '⚠ auth failed';
      addMsg('Could not authenticate with the server. Is it running?', 'ava');
    }
  }

  // ── Google OAuth mode ─────────────────────────────────────────────────────────
  function loadGoogleSignIn() {
    // Show overlay while we load Google's script
    overlay.style.display = 'flex';
    authEl.style.display = 'none';

    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.onload = initGoogleSignIn;
    script.onerror = () => {
      document.getElementById('signin-error').textContent =
        'Could not load Google Sign-In. Check your connection.';
      document.getElementById('signin-error').style.display = '';
    };
    document.head.appendChild(script);
  }

  function initGoogleSignIn() {
    google.accounts.id.initialize({
      client_id: _googleClientId,
      callback: handleGoogleCredential,
      auto_select: true,          // silently sign in returning users
      cancel_on_tap_outside: false,
    });

    // Render the button
    google.accounts.id.renderButton(
      document.getElementById('g-signin-btn-wrapper'),
      { theme: 'outline', size: 'large', text: 'continue_with', width: 296 }
    );

    // Also try One Tap
    google.accounts.id.prompt();
  }

  async function handleGoogleCredential(response) {
    try {
      const res = await fetch('/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_token: response.credential }),
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Sign-in failed');
      }
      const data = await res.json();
      _token = data.access_token;
      overlay.style.display = 'none';
      setReady(data.user);
    } catch(e) {
      const el = document.getElementById('signin-error');
      el.textContent = `Sign-in failed: ${e.message}`;
      el.style.display = '';
    }
  }

  // ── Send message ─────────────────────────────────────────────────────────────
  async function send() {
    const text = input.value.trim();
    if (!text || !_token) return;
    input.value = '';
    btn.disabled = true;
    addMsg(text, 'user');
    const typing = addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${_token}`,
        },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      typing.remove();

      if (res.status === 401) {
        // Token expired — re-auth and retry once
        _token = null;
        if (_oauthEnabled) {
          overlay.style.display = 'flex';
          initGoogleSignIn();
        } else {
          await obtainDevToken();
          if (_token) { input.value = text; await send(); return; }
        }
      } else if (!res.ok) {
        addMsg('⚠️ ' + (data.detail || 'Something went wrong. Please try again.'), 'ava');
      } else {
        sessionId = data.session_id;
        addMsg(data.response || 'Sorry, no response received.', 'ava', data.agent_name);
      }
    } catch(e) {
      typing.remove();
      addMsg('⚠️ Cannot reach the server. Is it running?', 'ava');
    }

    btn.disabled = false;
    input.focus();
  }

  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  init();
</script>
</body>
</html>
