<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LettingCopilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a3c5e; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span.badge { background: #2ecc71; color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; }
    header span.auth-status { font-size: 0.75rem; opacity: 0.7; margin-left: auto; }
    header span.auth-status.ok { color: #2ecc71; opacity: 1; }
    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 72%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 0.93rem; }
    .msg.user { background: #1a3c5e; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ava { background: white; color: #222; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .msg.ava .name { font-size: 0.75rem; font-weight: 600; color: #1a3c5e; margin-bottom: 4px; }
    .msg.ava .agent-tag { font-size: 0.68rem; color: #888; margin-top: 6px; }
    .msg.typing span { display: inline-block; width: 6px; height: 6px; background: #aaa; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
    .msg.typing span:nth-child(2) { animation-delay: .2s; }
    .msg.typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
    #input-area { background: white; border-top: 1px solid #e0e6ed; padding: 16px 20px; display: flex; gap: 10px; }
    #msg-input { flex: 1; border: 1px solid #d0d8e4; border-radius: 24px; padding: 10px 18px; font-size: 0.93rem; outline: none; }
    #msg-input:focus { border-color: #1a3c5e; }
    #send-btn { background: #1a3c5e; color: white; border: none; border-radius: 24px; padding: 10px 22px; cursor: pointer; font-size: 0.93rem; font-weight: 600; transition: background .2s; }
    #send-btn:hover { background: #14304d; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="#2ecc71"/><text x="14" y="19" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif" font-weight="bold">L</text></svg>
  <h1>LettingCopilot <span style="font-weight:300;opacity:.7">— AI Lettings Agent</span></h1>
  <span class="badge">POC · Dev</span>
  <span class="auth-status" id="auth-status">authenticating…</span>
</header>

<div id="chat-container">
  <div class="msg ava">
    <div class="name">LettingCopilot</div>
    Hi! I'm your AI lettings agent. Which property are you enquiring about, or how can I help you today?
  </div>
</div>

<div id="input-area">
  <input id="msg-input" type="text" placeholder="Type your message…" autocomplete="off" />
  <button id="send-btn" disabled>Send</button>
</div>

<script>
  const chatEl = document.getElementById('chat-container');
  const input  = document.getElementById('msg-input');
  const btn    = document.getElementById('send-btn');
  const authEl = document.getElementById('auth-status');

  let sessionId = null;
  let _token    = null;

  // ── JWT: obtain token on page load ──────────────────────────────────────────
  async function obtainToken() {
    try {
      const res = await fetch('/auth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_id: 'ui-guest', client_secret: 'ui-guest-secret' }),
      });
      if (!res.ok) throw new Error('auth failed');
      const data = await res.json();
      _token = data.access_token;
      authEl.textContent = '● authenticated';
      authEl.classList.add('ok');
      btn.disabled = false;
      input.focus();
    } catch (e) {
      authEl.textContent = '⚠ auth failed';
      addMsg('Could not authenticate with the server. Is it running?', 'ava');
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function addMsg(text, role, agentName) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    if (role === 'ava') {
      const nameLabel = agentName || 'LettingCopilot';
      div.innerHTML = `<div class="name">${escHtml(nameLabel)}</div>${escHtml(text)}`;
      if (agentName && agentName !== 'root_agent') {
        div.innerHTML += `<div class="agent-tag">via ${escHtml(agentName)}</div>`;
      }
    } else {
      div.textContent = text;
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg ava typing';
    div.innerHTML = '<div class="name">LettingCopilot</div><span></span><span></span><span></span>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  // ── Send message ─────────────────────────────────────────────────────────────
  async function send() {
    const text = input.value.trim();
    if (!text || !_token) return;
    input.value = '';
    btn.disabled = true;
    addMsg(text, 'user');
    const typing = addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${_token}`,
        },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      typing.remove();

      if (res.status === 401) {
        // Token expired — re-auth and retry once
        _token = null;
        authEl.textContent = 'authenticating…';
        authEl.classList.remove('ok');
        await obtainToken();
        if (_token) { input.value = text; send(); return; }
      } else if (!res.ok) {
        addMsg('⚠️ ' + (data.detail || 'Something went wrong. Please try again.'), 'ava');
      } else {
        sessionId = data.session_id;
        addMsg(data.response || 'Sorry, no response received.', 'ava', data.agent_name);
      }
    } catch (e) {
      typing.remove();
      addMsg('⚠️ Cannot reach the server. Is it running?', 'ava');
    }

    btn.disabled = false;
    input.focus();
  }

  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Kick off auth immediately
  obtainToken();
</script>
</body>
</html>
